# Builds GoWLauncher.exe on Windows and uploads it as a workflow artifact.
# No game data is used or available here: the launcher bundles only git-tracked sources and asks the player for
# their own disc image.
#
# A release is made by the publish job below, through the Auto Release action
# (https://github.com/marketplace/actions/auto-release, CupOfTea696/gh-action-auto-release): a pushed commit whose
# message starts with
#     Release: 1.7.0
# (or Release: v1.7.0, or Release: 1.7.0 (#72)) creates the release v1.7.0, with the same artifacts as a release
# made by hand: GoW_PSP_Launcher-v1.7.0.zip and SHA256SUMS.txt, plus their build provenance (GitHub adds the source
# archives itself). Its notes are that version's section of CHANGELOG.md, so write the section, set VERSION in
# tools/launcher.pyw to the same version, and make that commit the last change of the push: the ZIP is built from
# the pushed tree, and the job refuses to attach a ZIP named after another version.
# Any other commit publishes nothing. In the Actions tab, "Run workflow" with the release input ticked releases the
# VERSION of that commit the same way, without pushing anything.
name: launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release for this commit's VERSION (no release commit message needed)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # build provenance, on tags only (below)
      attestations: write
    env:
      # Artifact names can't contain "/", and a pull request's ref_name is "<number>/merge": name those "pr<number>".
      ARTIFACT_REF: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Same Python as the local build (3.15.0): the exe runs recomp.py in-process, and the byte-identical recomp
      # output was verified with this version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"

      - name: Install build requirements
        run: python -m pip install -r tools/requirements-dev.txt

      # Every language table complete, every text of the window fits in every language, the bug-report zip
      # (the window is laid out without being shown; no game data)
      - name: Launcher check
        run: python tools/check_launcher.py

      - name: Build GoWLauncher.exe
        run: python tools/build_launcher.py

      - name: Smoke test
        shell: pwsh
        run: |
          # The exe is a windowed (GUI-subsystem) app, so `& $exe` does not wait and leaves $LASTEXITCODE unset:
          # wait for each run and take its exit code from the process.
          $exe = "build/launcher_dist/GoWLauncher.exe"
          Start-Process $exe -ArgumentList "--check-tools" -Wait -NoNewWindow
          $p = Start-Process $exe -ArgumentList "--print-command coo" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      # The players' default toolchain: download llvm-mingw, CMake and Ninja (pinned SHA-256) like the launcher does
      # and build gow_disc with it (the game itself needs the recompiled C from a disc, which CI never has).
      - name: Portable toolchain check
        run: python tools/check_portable_toolchain.py

      # Players have no Git: fail if a Git fetch comes back (static scan + configure of both builds with Git hidden).
      - name: No-Git check
        run: python tools/check_no_git.py --full

      # SHA256SUMS.txt for the release: the ZIP and the exe inside it (sha256sum format; check with `sha256sum -c`
      # next to the ZIP, or compare with PowerShell's Get-FileHash)
      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $zip = Get-Item build/launcher_dist/GoW_PSP_Launcher-v*.zip
          Expand-Archive $zip.FullName build/sums_check -Force
          $exe = Get-Item build/sums_check/GoW_PSP/GoWLauncher.exe
          $lines = @("$((Get-FileHash $zip.FullName).Hash.ToLower())  $($zip.Name)",
                     "$((Get-FileHash $exe.FullName).Hash.ToLower())  GoW_PSP/GoWLauncher.exe")
          Set-Content build/launcher_dist/SHA256SUMS.txt ($lines -join "`n") -NoNewline -Encoding ascii
          Get-Content build/launcher_dist/SHA256SUMS.txt

      # For a release tag: a signed statement that this run built the ZIP and the exe from this commit, so anyone can
      # check a download with `gh attestation verify <file> --repo DrummingBird1/gow-psp-recomp`
      # (docs/troubleshooting.md). Publishes nothing else.
      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/launcher_dist/GoW_PSP_Launcher-v*.zip
            build/sums_check/GoW_PSP/GoWLauncher.exe

      # The release download: GoW_PSP_Launcher-v<VERSION>.zip (one GoW_PSP/ folder with the exe and README.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: GoW_PSP_Launcher-${{ env.ARTIFACT_REF }}-${{ github.sha }}
          path: |
            build/launcher_dist/GoW_PSP_Launcher-v*.zip
            build/launcher_dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: GoWLauncher-${{ env.ARTIFACT_REF }}-${{ github.sha }}
          path: build/launcher_dist/GoWLauncher.exe
          if-no-files-found: error

  publish:
    # Publishes exactly what the build job made, so an automatic release carries the same two files as a manual
    # one. A push to main is decided by the Auto Release action (the version in the release commit message); a
    # manual run releases the VERSION of that commit. Tags and pull requests never publish here: the release tag is
    # made by this job.
    needs: build
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the release, its tag and its assets
      id-token: write      # build provenance, like the releases built from a tag
      attestations: write
    env:
      # The Auto Release action has no token input: it reads GITHUB_TOKEN from the environment, and stops with
      # "The GITHUB_TOKEN environment variable was not set" on a step that doesn't have it. gh reads GITHUB_TOKEN
      # too (GH_TOKEN first: cli.github.com/manual/gh_help_environment), so this one variable serves both the
      # action and the gh commands below.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7      # CHANGELOG.md for the notes, and the repository for gh

      - uses: actions/download-artifact@v7
        with:
          name: GoW_PSP_Launcher-${{ env.ARTIFACT_REF }}-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: GoWLauncher-${{ env.ARTIFACT_REF }}-${{ github.sha }}
          path: dist

      # The version this run built. VERSION in tools/launcher.pyw names the ZIP, so the ZIP's name is the truth.
      - name: Which version this build is
        id: build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/GoW_PSP_Launcher-v*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected one GoW_PSP_Launcher-v*.zip in the build artifact, found ${#zips[@]}"
            exit 1
          fi
          version=${zips[0]##*/GoW_PSP_Launcher-v}
          version=${version%.zip}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "this run built v$version (${zips[0]})"

      # The release a commit asks for: the action matches the pushed commits against a pattern (the specific input
      # that decides whether a release happens) and makes the tag and the release when one matches.
      - name: "Create the release (a commit message with Release: <version>)"
        id: release
        if: github.event_name == 'push'
        uses: CupOfTea696/gh-action-auto-release@v1.0.2
        with:
          title: "v$semver"
          tag: "v$semver"
          draft: false
          changelog: CHANGELOG.md
          changelog-entry: "$semver"
          regex: '/^Release:\s*#{semver}\b/i'

      # A manual run (the release input ticked): the version this build is, notes from its CHANGELOG section. The
      # action can't decide this one: a manual run pushes nothing, so it has no commit messages to match.
      - name: Create the release (manual run)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.build.outputs.tag }}'
          awk -v v="$tag" '$0 ~ "^## " v "($|[^0-9])" { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $tag: write one (heading like ## $tag (2026-11-20)) before releasing"
            exit 1
          fi
          gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # The action takes the version from the commit message; this run's ZIP takes it from tools/launcher.pyw. A
      # release under another tag would offer this launcher as that other version (its self-update takes the
      # GoW_PSP_Launcher-v*.zip of the latest release), so stop before attaching anything to it.
      - name: The release must be this build's version
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          want='${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.build.outputs.tag }}'
          have='${{ steps.release.outputs.html_url }}'
          if [ "$have" != "$want" ]; then
            echo "::error::the release is $have, but this run built ${{ steps.build.outputs.zip }}: set VERSION in tools/launcher.pyw to ${{ steps.build.outputs.version }}, commit that, and release again (and delete $have, which has no files)"
            exit 1
          fi

      # The signed statement a tag build makes, so a download of this release can be checked with
      # `gh attestation verify GoW_PSP_Launcher-v<version>.zip --repo DrummingBird1/gow-psp-recomp`
      - name: Build provenance
        if: steps.release.outputs.released == 'true' || steps.manual.outputs.released == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/GoW_PSP_Launcher-v*.zip
            dist/GoWLauncher.exe

      # GoW_PSP_Launcher-v<VERSION>.zip and SHA256SUMS.txt, named and built as in the releases made by hand
      - name: Attach the launcher ZIP and SHA256SUMS.txt
        if: steps.release.outputs.released == 'true' || steps.manual.outputs.released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload '${{ steps.build.outputs.tag }}' '${{ steps.build.outputs.zip }}' dist/SHA256SUMS.txt
          gh release view '${{ steps.build.outputs.tag }}' --json tagName,assets --jq '"release " + .tagName + ": " + ([.assets[].name] | join(", "))'

      - name: No release for this push
        if: steps.release.outputs.released != 'true' && steps.manual.outputs.released != 'true'
        run: |
          echo "no release: no pushed commit message starts with 'Release: <version>', so nothing was published"
